  <text x="736" y="956" fill="#0891B2" font-family="Arial, sans-serif" font-size="30" font-weight="700">md</text>
  <text x="736" y="998" fill="#334155" font-family="Arial, sans-serif" font-size="24">Workflow and sequence diagrams</text>
