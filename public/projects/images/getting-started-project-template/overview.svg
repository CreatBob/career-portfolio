<svg width="2200" height="1320" viewBox="0 0 2200 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="2200" height="1320" rx="48" fill="#F8FAFC"/>
  <rect x="80" y="80" width="2040" height="1160" rx="40" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="4"/>
  <text x="150" y="190" fill="#0F172A" font-family="Arial, sans-serif" font-size="64" font-weight="700">Case Study Structure</text>
  <text x="150" y="254" fill="#64748B" font-family="Arial, sans-serif" font-size="28">Lead with the system, then zoom into responsibility, challenge, solution, and impact.</text>
  <rect x="150" y="330" width="360" height="210" rx="30" fill="#DBEAFE"/>
  <text x="190" y="420" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="34" font-weight="700">Context</text>
