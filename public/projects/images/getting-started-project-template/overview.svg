  <text x="190" y="510" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">What changed</text>
  <rect x="650" y="330" width="360" height="210" rx="30" fill="#E0F2FE"/>
  <text x="690" y="420" fill="#0891B2" font-family="Arial, sans-serif" font-size="34" font-weight="700">Ownership</text>
  <text x="690" y="470" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">Modules</text>
  <text x="690" y="510" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">Interfaces</text>
  <rect x="1150" y="330" width="360" height="210" rx="30" fill="#DCFCE7"/>
  <text x="1190" y="420" fill="#15803D" font-family="Arial, sans-serif" font-size="34" font-weight="700">Constraint</text>
  <text x="1190" y="470" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">Why this was hard</text>
  <text x="1190" y="510" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">What shaped the design</text>
  <rect x="1650" y="330" width="360" height="210" rx="30" fill="#FFEDD5"/>
  <text x="1690" y="420" fill="#EA580C" font-family="Arial, sans-serif" font-size="34" font-weight="700">Outcome</text>
  <text x="1690" y="470" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">Metric</text>
  <text x="1690" y="510" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">Operational change</text>
  <path d="M510 435H650" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <path d="M1010 435H1150" stroke="#0EA5E9" stroke-width="14" stroke-linecap="round"/>
