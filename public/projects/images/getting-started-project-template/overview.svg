  <text x="208" y="758" fill="#0F172A" font-family="Arial, sans-serif" font-size="42" font-weight="700">Image placement rule</text>
  <text x="208" y="820" fill="#475569" font-family="Arial, sans-serif" font-size="28">Put each image under the paragraph it proves. Readers should never guess why a screenshot is there.</text>
  <rect x="208" y="882" width="420" height="136" rx="24" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="4"/>
