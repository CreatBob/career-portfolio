<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" rx="40" fill="#F8FAFC"/>
  <text x="98" y="132" fill="#0F172A" font-family="Arial, sans-serif" font-size="54" font-weight="700">Async Ingestion Pipeline</text>
  <text x="98" y="186" fill="#64748B" font-family="Arial, sans-serif" font-size="24">The request path captured intent first, then background work finished the heavy processing.</text>
  <rect x="98" y="302" width="248" height="182" rx="28" fill="#DBEAFE"/>
  <rect x="474" y="302" width="248" height="182" rx="28" fill="#E0F2FE"/>
  <rect x="850" y="302" width="248" height="182" rx="28" fill="#DCFCE7"/>
  <rect x="1226" y="302" width="248" height="182" rx="28" fill="#FFEDD5"/>
  <text x="142" y="394" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="30" font-weight="700">1. Upload</text>
  <text x="142" y="438" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Validate + save</text>
  <text x="518" y="394" fill="#0891B2" font-family="Arial, sans-serif" font-size="30" font-weight="700">2. Task</text>
  <text x="518" y="438" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Create job</text>
  <text x="894" y="394" fill="#15803D" font-family="Arial, sans-serif" font-size="30" font-weight="700">3. Process</text>
  <text x="894" y="438" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Parse + chunk</text>
  <text x="1270" y="394" fill="#EA580C" font-family="Arial, sans-serif" font-size="30" font-weight="700">4. Ready</text>
  <text x="1270" y="438" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Retrieve + bind</text>
  <path d="M346 394H474" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <path d="M722 394H850" stroke="#0EA5E9" stroke-width="14" stroke-linecap="round"/>
  <path d="M1098 394H1226" stroke="#16A34A" stroke-width="14" stroke-linecap="round"/>
  <rect x="98" y="584" width="1376" height="284" rx="30" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4"/>
  <text x="148" y="664" fill="#0F172A" font-family="Arial, sans-serif" font-size="36" font-weight="700">Why the split mattered</text>
  <text x="148" y="726" fill="#334155" font-family="Arial, sans-serif" font-size="26">The product needed fast acknowledgement on upload, but the system still had to finish parsing and retrieval preparation correctly in the background.</text>
  <text x="148" y="778" fill="#64748B" font-family="Arial, sans-serif" font-size="24">This separation made the user experience smoother and gave the team a clearer way to observe retries, failures, and task states.</text>
</svg>
