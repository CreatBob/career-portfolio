  <title id="title">陈永冠中文签名字标</title>
  <desc id="desc">现代手写签名字形，用于中文首页 Hero 主视觉。</desc>
  <defs>
    <linearGradient id="inkStroke" x1="110" y1="80" x2="1040" y2="280" gradientUnits="userSpaceOnUse">
